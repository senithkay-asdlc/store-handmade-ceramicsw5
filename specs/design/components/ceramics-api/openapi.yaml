openapi: 3.0.3
info:
  title: Ceramics API
  version: 0.1.0
  description: Product catalog, cart, checkout, orders, and admin catalog management for the handmade ceramics store.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }
    CartItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Product:
      type: object
      required: [id, name, price, stockQuantity, available]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number, format: float }
        stockQuantity: { type: integer }
        available: { type: boolean, description: derived true when stockQuantity > 0 }
        photoUrls: { type: array, items: { type: string } }
    ProductInput:
      type: object
      required: [name, price, stockQuantity]
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number, format: float }
        stockQuantity: { type: integer }
        photoUrls: { type: array, items: { type: string } }
    CartItem:
      type: object
      required: [id, productId, quantity]
      properties:
        id: { type: string }
        productId: { type: string }
        productName: { type: string }
        unitPrice: { type: number, format: float }
        quantity: { type: integer }
    Cart:
      type: object
      required: [id, items, total]
      properties:
        id: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        total: { type: number, format: float }
    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
    Order:
      type: object
      required: [id, status, total, items, placedAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, paid, failed] }
        total: { type: number, format: float }
        placedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [productId, quantity, unitPrice]
            properties:
              productId: { type: string }
              productName: { type: string }
              quantity: { type: integer }
              unitPrice: { type: number, format: float }
    OrderInput:
      type: object
      required: [paymentMethodToken]
      properties:
        paymentMethodToken: { type: string, description: tokenized card payment method from the checkout form }
security:
  - bearerAuth: []
paths:
  /products:
    get:
      operationId: listProducts
      summary: List/search/filter the product catalog
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: search text over name/description
        - name: category
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: matching products
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
    post:
      operationId: createProduct
      summary: Create a new product (store admin only)
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: invalid product input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not a store admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getProduct
      summary: Get a product's details
      responses:
        '200':
          description: the product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateProduct
      summary: Update a product, including its stock quantity (store admin only)
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: product updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: invalid product input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not a store admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteProduct
      summary: Remove a product from the catalog (store admin only)
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: product removed
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not a store admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /cart:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getCart
      summary: Get the caller's current cart
      responses:
        '200':
          description: the caller's cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /cart/items:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: addCartItem
      summary: Add a product to the caller's cart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemInput' }
      responses:
        '201':
          description: item added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          description: invalid quantity or insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /cart/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/CartItemId'
    patch:
      operationId: updateCartItem
      summary: Update a cart item's quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: cart item updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          description: invalid quantity or insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: cart item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: removeCartItem
      summary: Remove an item from the cart
      responses:
        '204':
          description: item removed
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: cart item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listOrders
      summary: List orders — the caller's own orders, or all orders for a store admin
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid, failed] }
      responses:
        '200':
          description: matching orders
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createOrder
      summary: Check out the caller's cart — charges the card and places the order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201':
          description: order placed and paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: empty cart or insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: card payment declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      summary: Get one order's details — the caller's own, or any for a store admin
      responses:
        '200':
          description: the order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller may not view this order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
